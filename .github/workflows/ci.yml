name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Neblocant pana urcam nodemailer la v10 (vulnerabilitate high, necesita salt de major).
      # Dupa upgrade, sterge linia continue-on-error ca auditul sa blocheze din nou.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
